<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Waira Gestor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #E30613;
            --secondary: #C4B49F;
            --accent: #D7C7A8;
            --light: #f8f9fa;
            --dark: #5a5c69;
            --text-light: #FFFFFF;
            --background: #fefaf0;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        .login-container {
            background: var(--background);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
        }
        
        .logo-container {
            margin-bottom: 1.5rem;
        }
        
        .company-logo {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border: 3px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }
        
        .company-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .logo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
        }
        
        .form-control {
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            border: 2px solid #e3e6f0;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(227, 6, 19, 0.25);
            transform: translateY(-2px);
        }
        
        .input-group-text {
            background: var(--accent);
            border: 2px solid #e3e6f0;
            border-right: none;
            border-radius: 50px 0 0 50px;
            padding-left: 1.5rem;
        }
        
        .form-control.border-start-0 {
            border-left: none;
            border-radius: 0 50px 50px 0;
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 50px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(227, 6, 19, 0.3);
        }
        
        .btn-login:active {
            transform: translateY(-1px);
        }
        
        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .forgot-password:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
        
        .alert {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }
        
        .login-footer {
            text-align: center;
            padding: 1rem;
            background: var(--accent);
            color: var(--dark);
            font-size: 0.9rem;
        }
        
        /* Efectos de carga */
        .btn-loading {
            position: relative;
            color: transparent;
        }
        
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: button-loading-spinner 1s ease infinite;
        }
        
        @keyframes button-loading-spinner {
            from { transform: rotate(0turn); }
            to { transform: rotate(1turn); }
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            body {
                padding: 10px;
            }
            
            .login-container {
                margin: 10px;
            }
            
            .login-header {
                padding: 2rem 1.5rem;
            }
            
            .company-logo {
                width: 80px;
                height: 80px;
            }
            
            .logo-placeholder {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="login-container">
                    <div class="login-header">
                        <div class="logo-container">
                            <!-- Logo de la empresa - Reemplazar con imagen real -->
                            <div class="company-logo">
                                <div class="logo-placeholder">
                                    <i class="bi bi-calendar-check"></i>
                                </div>
                                <!-- Para usar imagen real: -->
                                <!-- <img src="{{ url_for('static', filename='img/logo-waira.png') }}" alt="Waira Logo"> -->
                            </div>
                            <h3 class="mb-2">WAIRA GESTOR</h3>
                            <p class="mb-0 opacity-75">Sistema de Gestión de Horarios</p>
                        </div>
                    </div>
                    
                    <div class="card-body p-4">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }} alert-dismissible fade show mb-4" role="alert">
                                        <i class="bi {% if category == 'success' %}bi-check-circle-fill{% elif category == 'danger' %}bi-exclamation-circle-fill{% elif category == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %} me-2"></i>
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        
                        <form method="POST" id="loginForm">
                            <div class="mb-4">
                                <label for="email" class="form-label">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                    <input type="email" name="email" id="email" class="form-control border-start-0" 
                                           required placeholder="correo@ejemplo.com" 
                                           value="{{ request.form.email if request.form }}">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" name="password" id="password" 
                                           class="form-control border-start-0" required 
                                           placeholder="Ingresa tu contraseña">
                                </div>
                            </div>
                            
                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-login text-white" id="loginButton">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
                                </button>
                            </div>
                            
                            <div class="text-center">
                                <a href="{{ url_for('forgot_password') }}" class="forgot-password">
                                    <i class="bi bi-question-circle me-1"></i>¿Olvidó su contraseña?
                                </a>
                            </div>
                        </form>
                    </div>
                    
                    <div class="login-footer">
                        <small>&copy; 2024 Waira Gestor. Todos los derechos reservados.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            
            loginForm.addEventListener('submit', function() {
                // Mostrar estado de carga
                loginButton.disabled = true;
                loginButton.innerHTML = '<span class="btn-loading"></span>';
                
                // Revertir después de 5 segundos por si hay error
                setTimeout(() => {
                    if (loginButton.disabled) {
                        loginButton.disabled = false;
                        loginButton.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema';
                    }
                }, 5000);
            });
            
            // Efecto de focus en los inputs
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                });
                
                input.addEventListener('blur', function() {
                    if (!this.value) {
                        this.parentElement.classList.remove('focused');
                    }
                });
            });
        });
    </script>
</body>
</html>
