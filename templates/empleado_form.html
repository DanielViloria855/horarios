{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">🧑‍🍳 Registrar Nuevo Empleado</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('nuevo_empleado') }}" method="POST">
                    
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo:</label>
                        <input type="text" name="nombre" id="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="documento" class="form-label">Número de Documento:</label>
                        <input type="text" name="documento" id="documento" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="cargo" class="form-label">Cargo:</label>
                        <select name="cargo" id="cargo" class="form-select" required>
                            <option value="" disabled selected>-- Selecciona un cargo --</option>
                            <option value="Cajera">Cajera</option>
                            <option value="Mesero">Meser@</option>
                            <option value="Cocinero">Cociner@</option>
                            <option value="Bartender">Bartender</option>
                            <option value="Oficios Varios">Oficios Varios</option>
                            <option value="Administración">Administración</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fecha_ingreso" class="form-label">Fecha de Ingreso:</label>
                            <input type="date" name="fecha_ingreso" id="fecha_ingreso" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="estado" class="form-label">Estado:</label>
                            <select name="estado" id="estado" class="form-select" required>
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                         <button type="submit" class="btn btn-primary">Guardar Empleado</button>
                         <a href="{{ url_for('listar_empleados') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
