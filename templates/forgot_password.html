<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Waira Gestor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #E30613;
            --secondary: #C4B49F;
            --accent: #D7C7A8;
            --light: #f8f9fa;
            --dark: #5a5c69;
            --text-light: #FFFFFF;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Nunito', sans-serif;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .logo-container {
            margin-bottom: 1rem;
        }
        
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 2rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 50px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(227, 6, 19, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-container">
                    <div class="login-header">
                        <div class="logo-container">
                            <div class="logo-placeholder">
                                <i class="bi bi-calendar-check"></i>
                            </div>
                            <h4 class="mb-1">WAIRA GESTOR</h4>
                            <p class="mb-0 opacity-75">Recuperación de Contraseña</p>
                        </div>
                    </div>
                    
                    <div class="card-body p-4">
                        <div class="alert alert-info">
                            <h5><i class="bi bi-info-circle me-2"></i>Contacte a Soporte</h5>
                            <p class="mb-2">Para recuperar su contraseña, por favor contacte al administrador del sistema:</p>
                            <div class="d-flex align-items-center mt-3">
                                <i class="bi bi-person me-2"></i>
                                <strong>Daniel Viloria</strong>
                            </div>
                            <div class="d-flex align-items-center mt-2">
                                <i class="bi bi-whatsapp me-2"></i>
                                <strong>WhatsApp: 3186456619</strong>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <a href="{{ url_for('login') }}" class="btn btn-primary">
                                <i class="bi bi-arrow-left me-2"></i>Volver al Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
